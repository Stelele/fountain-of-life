name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_YOUTUBE_CHANNEL_ID: ${{ secrets.VITE_YOUTUBE_CHANNEL_ID }}

      - name: Copy 404 fallback for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Deploy to build repo
        run: |
          git clone https://${{ secrets.PAT }}@github.com/${{ secrets.BUILD_REPO }}.git out
          rm -rf out/*
          cp -R dist/* out/
          cd out
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy build files" || echo "No changes to commit"
          git push origin main
        env:
          PAT: ${{ secrets.PAT }}
